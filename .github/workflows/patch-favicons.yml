name: patch-favicons
on: push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 patch_icons.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm -q --cached patch_icons.py .github/workflows/patch-favicons.yml
          rm -f patch_icons.py .github/workflows/patch-favicons.yml
          git add index.html
          git commit -m "Reference full favicon set in index.html"
          git push
